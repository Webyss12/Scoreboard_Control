<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Scoreboard Controller</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
  overscroll-behavior:none;
}

:root{

  --bg:#05070c;
  --surface:#0a0f18;
  --surface2:#101827;

  --border:#1a2433;
  --border2:#243247;

  --text:#d9e4f2;
  --muted:#5c6d81;

  --accent:#00e6c3;

  --home:#ff5656;
  --guest:#4f82ff;

  --green:#39e273;
  --amber:#ffb400;
  --danger:#ff3e52;

  --radius:18px;
  --gap:8px;

  --bw:58px;
  --bh:48px;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:6px;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:1400px;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}

/* HEADER */

.hdr{
  flex:0 0 54px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:linear-gradient(180deg,#09111b,#070d15);

  border:1px solid var(--border);
  border-radius:22px;

  padding:0 18px;
}

.hdr-title{
  font-family:'Orbitron',monospace;
  font-size:16px;
  font-weight:700;
  letter-spacing:5px;
  color:var(--accent);
}

.conn{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:11px;
  letter-spacing:2px;
  color:var(--green);
}

.conn-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

/* MAIN */

main{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:10px;

  overflow:hidden;
}

/* PANES */

.pane{
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
}

/* SCORE STRIP */

.score-strip{
  flex:0 0 155px;

  display:grid;
  grid-template-columns:1fr auto 1fr;

  background:linear-gradient(180deg,#09111b,#060b12);

  border:1px solid var(--border);
  border-radius:26px;

  overflow:hidden;
}

.sc-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.sc-cell.hc{
  border-right:1px solid var(--border);
}

.sc-cell.gc{
  border-left:1px solid var(--border);
}

.sc-tag{
  font-family:'Orbitron',monospace;
  font-size:12px;
  letter-spacing:5px;
}

.sc-tag.h{
  color:var(--home);
}

.sc-tag.g{
  color:var(--guest);
}

.sc-tag.m{
  color:var(--accent);
}

.sc-num{
  font-family:'Orbitron',monospace;
  font-size:72px;
  font-weight:900;
  line-height:1;
  color:white;
}

.sc-mid{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:6px;
  padding:0 32px;
}

.sc-time{
  font-family:'Orbitron',monospace;
  font-size:42px;
  font-weight:900;
  color:var(--amber);
}

.sc-shot{
  font-family:'Orbitron',monospace;
  font-size:32px;
  font-weight:900;
  color:var(--guest);
}

.sc-slbl{
  font-size:11px;
  letter-spacing:4px;
  color:var(--muted);
}

.sc-foul{
  font-size:11px;
  letter-spacing:4px;
  color:var(--muted);
}

.sc-foul b{
  color:var(--amber);
  font-size:22px;
}

.rpill{
  min-width:90px;
  text-align:center;

  padding:5px 10px;

  border-radius:999px;

  border:1px solid var(--border2);

  font-size:11px;
  letter-spacing:3px;

  color:var(--muted);

  background:#0a121d;
}

.rpill.on{
  color:var(--green);
  border-color:#1b5832;
}

/* PERIOD */

.period-row{
  flex:0 0 54px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.bq{
  border:none;
  border-radius:14px;

  background:#0c1420;
  border:1px solid var(--border2);

  color:#7c8ca1;

  font-family:'Orbitron',monospace;
  font-size:16px;

  cursor:pointer;
}

.bq.active{
  background:#0b2223;
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 12px rgba(0,230,195,.15);
}

/* GROUPS */

.grp{
  background:linear-gradient(180deg,#09111b,#060b12);

  border:1px solid var(--border);

  border-radius:24px;

  padding:14px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:12px;

  position:relative;
  overflow:hidden;
}

.grp::before{
  content:attr(data-label);

  position:absolute;
  top:10px;
  left:16px;

  font-family:'Orbitron',monospace;
  font-size:11px;
  letter-spacing:5px;

  color:#5f7288;
}

/* LEFT GROUP SIZES */

.grp.score{
  flex:1.2;
}

.grp.fouls{
  flex:.7;
}

/* RIGHT GROUP SIZES */

.grp.timer{
  flex:1.1;
}

.grp.shot{
  flex:.85;
}

.grp.system{
  flex:.9;
}

/* ROWS */

.brow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:18px;
}

.bdiv{
  width:1px;
  height:42px;
  background:var(--border2);
}

/* BUTTONS */

.btn{
  width:var(--bw);
  height:var(--bh);

  border:none;
  border-radius:14px;

  font-family:'Rajdhani',sans-serif;
  font-weight:700;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:2px;

  cursor:pointer;
  user-select:none;

  transition:.12s;
}

.btn:active{
  transform:scale(.92);
}

.btn .lbl{
  font-size:16px;
}

.btn .sub{
  font-size:8px;
  letter-spacing:1px;
}

.btn .ico{
  font-size:16px;
}

.bw2{
  flex:1;
}

/* COLORS */

.sH{
  background:linear-gradient(180deg,#701414,#521010);
  color:#ff7070;
}

.sHd{
  background:linear-gradient(180deg,#501010,#340909);
  color:#ff9c9c;
}

.sG{
  background:linear-gradient(180deg,#143174,#102356);
  color:#7ca4ff;
}

.sGd{
  background:linear-gradient(180deg,#102456,#0a1739);
  color:#a4c1ff;
}

.sSt{
  background:linear-gradient(180deg,#167330,#0d5521);
  color:#7effa7;
}

.sPa{
  background:linear-gradient(180deg,#8a1f1f,#6a1212);
  color:#ff8d8d;
}

.sSh{
  background:linear-gradient(180deg,#1a3d93,#112a6a);
  color:#a7c0ff;
}

.sNe{
  background:linear-gradient(180deg,#1d2735,#151d29);
  color:#b9c3d2;
}

.sAm{
  background:linear-gradient(180deg,#8a6300,#634600);
  color:#ffd15f;
}

.sAc{
  background:linear-gradient(180deg,#0b6a55,#07463a);
  color:#6dffd9;
}

.sDa{
  background:linear-gradient(180deg,#90121f,#6d0d17);
  color:#ff9ba5;
}

/* TIMER INPUTS */

.setrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  margin-top:14px;
}

.setrow input{
  width:120px;
  height:90px;

  background:#050b14;

  border:1px solid var(--border2);
  border-radius:18px;

  color:var(--amber);

  font-family:'Orbitron',monospace;
  font-size:42px;
  font-weight:900;

  text-align:center;
}

.setrow input:focus{
  outline:none;
  border-color:var(--amber);
}

.col{
  font-size:42px;
  color:var(--amber);
  font-family:'Orbitron',monospace;
}

.btn-set{
  width:140px;
  height:90px;

  border:none;
  border-radius:18px;

  background:linear-gradient(180deg,#8a6300,#6a4b00);

  color:#ffd66d;

  font-family:'Orbitron',monospace;
  font-size:28px;
  font-weight:700;

  cursor:pointer;
}

/* BIG BUTTONS */

.grp.timer .bw2,
.grp.system .bw2{
  height:82px;
}

.grp.shot .btn{
  flex:1;
  height:82px;
}

/* TOAST */

.toast{
  position:fixed;

  bottom:20px;
  left:50%;

  transform:translateX(-50%) translateY(80px);

  background:#0c2417;
  border:1px solid #1b5c36;

  color:#7effa7;

  padding:10px 18px;

  border-radius:999px;

  font-size:12px;
  letter-spacing:3px;

  opacity:0;
  transition:.2s;

  z-index:999;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.err{
  background:#341018;
  border-color:#6d1824;
  color:#ff7b8a;
}

/* MOBILE PORTRAIT */

@media (orientation:portrait){

  main{
    grid-template-columns:1fr;
  }

  .score-strip{
    flex:0 0 130px;
  }

  .sc-num{
    font-size:52px;
  }

  .sc-time{
    font-size:30px;
  }

  .sc-shot{
    font-size:24px;
  }

  .setrow input{
    width:70px;
    height:56px;
    font-size:24px;
  }

  .btn-set{
    width:80px;
    height:56px;
    font-size:18px;
  }

  .grp.timer .bw2,
  .grp.system .bw2,
  .grp.shot .btn{
    height:56px;
  }
}

</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="app">

<header class="hdr">
  <div class="hdr-title">⬡ SCOREBOARD</div>

  <div class="conn">
    <div class="conn-dot" id="dot"></div>
    <span id="statusTxt">LIVE</span>
  </div>
</header>

<main>

<!-- LEFT -->

<div class="pane">

  <div class="score-strip">

    <div class="sc-cell hc">
      <div class="sc-tag h">HOME</div>
      <div class="sc-num" id="home">0</div>
      <div class="sc-foul">FOULS <b id="hf">0</b></div>
    </div>

    <div class="sc-mid">

      <div class="sc-tag m">GAME</div>
      <div class="sc-time" id="time">12:00</div>
      <div class="rpill" id="timerBadge">STOP</div>

      <div class="sc-slbl">SHOT</div>
      <div class="sc-shot" id="shot">24</div>
      <div class="rpill" id="shotBadge">STOP</div>

    </div>

    <div class="sc-cell gc">
      <div class="sc-tag g">GUEST</div>
      <div class="sc-num" id="guest">0</div>
      <div class="sc-foul">FOULS <b id="gf">0</b></div>
    </div>

  </div>

  <div class="period-row">
    <button class="bq" id="pBtn1" onclick="setPeriod(1)">Q1</button>
    <button class="bq" id="pBtn2" onclick="setPeriod(2)">Q2</button>
    <button class="bq" id="pBtn3" onclick="setPeriod(3)">Q3</button>
    <button class="bq" id="pBtn4" onclick="setPeriod(4)">Q4</button>
  </div>

  <!-- SCORE -->

  <div class="grp score" data-label="SCORE">

    <div class="brow">

      <button class="btn sH" onclick="addScore('home',1)">
        <span class="lbl">+1</span>
      </button>

      <button class="btn sH" onclick="addScore('home',2)">
        <span class="lbl">+2</span>
      </button>

      <button class="btn sH" onclick="addScore('home',3)">
        <span class="lbl">+3</span>
      </button>

      <div class="bdiv"></div>

      <button class="btn sG" onclick="addScore('guest',1)">
        <span class="lbl">+1</span>
      </button>

      <button class="btn sG" onclick="addScore('guest',2)">
        <span class="lbl">+2</span>
      </button>

      <button class="btn sG" onclick="addScore('guest',3)">
        <span class="lbl">+3</span>
      </button>

    </div>

    <div class="brow">

      <button class="btn bw2 sHd" onclick="addScore('home',-1)">
        <span class="lbl">HOME −1</span>
      </button>

      <button class="btn bw2 sGd" onclick="addScore('guest',-1)">
        <span class="lbl">GUEST −1</span>
      </button>

    </div>

  </div>

  <!-- FOULS -->

  <div class="grp fouls" data-label="FOULS">

    <div class="brow">

      <button class="btn bw2 sH" onclick="addFoul('hf',1)">
        <span class="ico">⚑</span>
        <span class="lbl">HOME</span>
      </button>

      <button class="btn bw2 sHd" onclick="addFoul('hf',-1)">
        <span class="lbl">−1</span>
      </button>

      <button class="btn bw2 sG" onclick="addFoul('gf',1)">
        <span class="ico">⚑</span>
        <span class="lbl">GUEST</span>
      </button>

      <button class="btn bw2 sGd" onclick="addFoul('gf',-1)">
        <span class="lbl">−1</span>
      </button>

    </div>

  </div>

</div>

<!-- RIGHT -->

<div class="pane">

  <!-- TIMER -->

  <div class="grp timer" data-label="GAME TIMER">

    <div class="setrow">

      <input type="number" id="min" min="0" max="99" value="12">

      <span class="col">:</span>

      <input type="number" id="sec" min="0" max="59" value="0">

      <button class="btn-set" onclick="setTime()">SET</button>

    </div>

    <div class="brow">

      <button class="btn bw2 sSt" onclick="setTimerRun(true)">
        <span class="ico">▶</span>
        <span class="lbl">START</span>
      </button>

      <button class="btn bw2 sPa" onclick="setTimerRun(false)">
        <span class="ico">⏸</span>
        <span class="lbl">PAUSE</span>
      </button>

    </div>

  </div>

  <!-- SHOT -->

  <div class="grp shot" data-label="SHOT CLOCK">

    <div class="brow">

      <button class="btn sSh" onclick="setShotRun(true)">
        <span class="ico">▶</span>
      </button>

      <button class="btn sNe" onclick="setShotRun(false)">
        <span class="ico">⏸</span>
      </button>

      <button class="btn sAm" onclick="resetShot(24)">
        <span class="lbl">24s</span>
      </button>

      <button class="btn sAm" onclick="resetShot(14)">
        <span class="lbl">14s</span>
      </button>

    </div>

  </div>

  <!-- SYSTEM -->

  <div class="grp system" data-label="SYSTEM">

    <div class="brow">

      <button class="btn bw2 sAc" onclick="doBuzz()">
        <span class="ico">🔔</span>
        <span class="lbl">BUZZER</span>
      </button>

      <button class="btn bw2 sDa" onclick="doReset()">
        <span class="ico">⚠</span>
        <span class="lbl">RESET</span>
      </button>

    </div>

  </div>

</div>

</main>

</div>

<script>

var firebaseConfig = {
  apiKey:"AIzaSyCBeW3-StyUaqnfMb9SeKQL6oESlxJ_ZFg",
  databaseURL:"https://scoreboard-c0863-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.database();
var scoreRef = db.ref("scoreboard");

function G(id){
  return document.getElementById(id);
}

function pad(n){
  return String(n).padStart(2,'0');
}

var _tt;

function toast(msg,err){

  var t=G('toast');

  t.textContent=msg;

  t.className='toast'+(err?' err':'')+' show';

  clearTimeout(_tt);

  _tt=setTimeout(function(){
    t.className='toast'+(err?' err':'');
  },1400);
}

function addScore(f,v){

  scoreRef.child(f).transaction(function(c){

    var n=(c||0)+v;

    return n<0?0:n;
  });
}

function addFoul(f,v){

  scoreRef.child(f).transaction(function(c){

    var n=(c||0)+v;

    return n<0?0:n;
  });
}

function setTimerRun(s){

  scoreRef.child("timerRun").set(s);

  toast(s?"START":"PAUSE");
}

function setShotRun(s){

  scoreRef.child("shotRun").set(s);

  toast(s?"SHOT ON":"SHOT OFF");
}

function resetShot(v){

  scoreRef.update({
    shot:v,
    shotRun:true
  });

  toast(v+"s");
}

function setPeriod(n){

  scoreRef.update({
    period:n
  });

  toast("Q"+n);
}

function setTime(){

  var m=parseInt(G('min').value,10);
  var s=parseInt(G('sec').value,10);

  if(isNaN(m)||isNaN(s)){
    toast("BAD INPUT",true);
    return;
  }

  scoreRef.update({
    minutes:Math.max(0,Math.min(99,m)),
    seconds:Math.max(0,Math.min(59,s)),
    timerRun:false
  });

  toast("TIME SET");
}

function doBuzz(){

  scoreRef.child("buzz").set(false).then(function(){
    scoreRef.child("buzz").set(true);
  });

  toast("BUZZ!");
}

function doReset(){

  if(!confirm("Reset scoreboard?")) return;

  scoreRef.set({
    home:0,
    guest:0,
    hf:0,
    gf:0,
    shot:24,
    period:1,
    minutes:12,
    seconds:0,
    timerRun:false,
    shotRun:false,
    buzz:false
  });

  toast("RESET");
}

function pill(id,on){

  var e=G(id);

  e.textContent=on?"RUN":"STOP";

  e.className='rpill'+(on?' on':'');
}

function startListeners(){

  scoreRef.on("value",function(snap){

    var d=snap.val()||{};

    G('home').textContent=d.home||0;
    G('guest').textContent=d.guest||0;

    G('hf').textContent=d.hf||0;
    G('gf').textContent=d.gf||0;

    G('shot').textContent=d.shot||24;

    var m=d.minutes!==undefined?d.minutes:12;
    var s=d.seconds!==undefined?d.seconds:0;

    G('time').textContent=pad(m)+":"+pad(s);

    pill('timerBadge',d.timerRun);
    pill('shotBadge',d.shotRun);

    var p=d.period||1;

    for(var i=1;i<=4;i++){

      var b=G('pBtn'+i);

      b.className='bq'+(i===p?' active':'');
    }

  });

  db.ref(".info/connected").on("value",function(snap){

    var on=snap.val()===true;

    G('dot').style.background=on?'#39e273':'#ff3e52';

    G('statusTxt').textContent=on?'LIVE':'OFFLINE';
  });
}

startListeners();

</script>

</body>
</html>
