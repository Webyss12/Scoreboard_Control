<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:Arial,sans-serif;
  background:#0d0f14;
  color:#fff;
  text-align:center;
  min-height:100vh;
}

/* ── HEADER ─────────────────────────────────────────── */
.header{
  background:#0d1520;
  border-bottom:1px solid #1a2a3a;
  padding:14px 0 8px;
}
.header h1{
  font-size:22px;
  letter-spacing:4px;
  color:#00e5cc;
  font-weight:bold;
  text-transform:uppercase;
}
.status-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:5px 0 2px;
  font-size:11px;
  letter-spacing:2px;
  color:#556;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#555;transition:background 0.3s;}
.status-dot.on {background:#3c3;box-shadow:0 0 6px #3c3;}
.status-dot.off{background:#e33;box-shadow:0 0 6px #e33;}

/* ── LAYOUT ─────────────────────────────────────────── */
.container{padding:12px;}
.scoreboard{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.panel{
  border-radius:12px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.panel-home {background:linear-gradient(160deg,#2a0a0a,#1a0505);border:1px solid #5a1515;}
.panel-time {background:linear-gradient(160deg,#111822,#0c1219);border:1px solid #1e3048;}
.panel-guest{background:linear-gradient(160deg,#050a2a,#03061a);border:1px solid #101a5a;}
.panel-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;}
.home-label {color:#e05050;}
.guest-label{color:#5080e0;}
.time-label {color:#aabbcc;}

.score{font-size:clamp(50px,12vw,90px);font-weight:bold;line-height:1;color:#fff;margin:4px 0;}
.game-time{font-size:clamp(30px,7vw,52px);font-weight:bold;color:#f0a800;letter-spacing:2px;}
.shot-label{font-size:11px;letter-spacing:3px;color:#778899;margin-top:4px;}
.shot-val{font-size:clamp(22px,5vw,32px);font-weight:bold;color:#50aaff;}
.foul-row{font-size:11px;letter-spacing:2px;color:#778;margin-top:4px;}
.foul-num{font-size:18px;font-weight:bold;color:#e05050;margin-left:3px;}

/* ── SET TIME ───────────────────────────────────────── */
.set-time{width:100%;margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.time-inputs{display:flex;align-items:center;gap:4px;}
.time-inputs input{
  width:44px;padding:6px 4px;border-radius:6px;
  border:1px solid #2a4060;background:#0d1520;
  color:#fff;font-size:15px;text-align:center;
}
.time-inputs input:focus{outline:none;border-color:#f0a800;}
.set-btn{
  width:100%;padding:7px 0;border:none;border-radius:6px;
  background:linear-gradient(180deg,#8a6010,#6a4808);
  color:#ffd060;font-size:12px;letter-spacing:2px;
  cursor:pointer;border-top:1px solid #c08820;
}

/* ── SECTION LABELS ─────────────────────────────────── */
.section-label{
  font-size:11px;letter-spacing:3px;color:#445566;
  text-align:left;margin:12px 0 5px 2px;text-transform:uppercase;
}
.team-row{display:flex;justify-content:space-around;margin-bottom:5px;}
.team-row span{font-size:11px;letter-spacing:3px;font-weight:bold;text-transform:uppercase;}

/* ── BUTTONS ────────────────────────────────────────── */
.btn-group{display:flex;gap:7px;width:100%;margin-bottom:3px;}
button{
  flex:1;padding:16px 8px;border:none;border-radius:8px;
  font-size:13px;letter-spacing:1px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:filter 0.12s,transform 0.1s;
  border-top:1px solid rgba(255,255,255,0.07);
}
button:active{transform:scale(0.96);filter:brightness(0.8);}
.btn-home   {background:linear-gradient(180deg,#6a1010,#4a0808);color:#ff8080;border-top-color:#a02020;font-weight:bold;}
.btn-guest  {background:linear-gradient(180deg,#0a1060,#060a40);color:#8090ff;border-top-color:#2030a0;font-weight:bold;}
.btn-start  {background:linear-gradient(180deg,#1a5020,#0e3012);color:#50e880;border-top-color:#2a7030;}
.btn-pause  {background:linear-gradient(180deg,#601010,#400808);color:#ff6060;border-top-color:#902020;}
.btn-shotst {background:linear-gradient(180deg,#102050,#081430);color:#60a0ff;border-top-color:#1840a0;}
.btn-neutral{background:linear-gradient(180deg,#202028,#141418);color:#778899;}
.btn-buzz   {background:linear-gradient(180deg,#504010,#302808);color:#ffc040;border-top-color:#807020;}
.btn-danger {background:linear-gradient(180deg,#501010,#300808);color:#ff5050;border-top-color:#802020;}
.btn-sub    {background:linear-gradient(180deg,#302010,#201408);color:#cc8030;font-size:11px;}

/* ── PERIOD ACTIVE ──────────────────────────────────── */
.btn-period{background:linear-gradient(180deg,#202028,#141418);color:#778899;}
.btn-period.active{background:linear-gradient(180deg,#204060,#102030);color:#00e5cc;border-top-color:#3090c0;}

/* ── RUNNING INDICATOR ──────────────────────────────── */
.running-badge{
  display:inline-block;font-size:9px;letter-spacing:2px;
  padding:2px 7px;border-radius:10px;margin-top:3px;transition:all 0.3s;
}
.running-badge.on {background:#1a3a1a;color:#50e880;border:1px solid #2a6030;}
.running-badge.off{background:#1a1a1a;color:#445;border:1px solid #2a2a2a;}

/* ── SOUNDBOARD ─────────────────────────────────────── */
.soundboard-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:3px;
}
.btn-sound{
  padding:14px 8px;border:none;border-radius:8px;
  font-size:11px;letter-spacing:1px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:filter 0.12s,transform 0.1s;
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.3;
}
.btn-sound:active{transform:scale(0.94);filter:brightness(0.7);}
.btn-sound .snd-icon{font-size:22px;}
.btn-sound.playing{animation:soundPulse 0.2s ease;}
@keyframes soundPulse{0%{transform:scale(1);}50%{transform:scale(1.07);}100%{transform:scale(1);}}

.snd-crowd  {background:linear-gradient(180deg,#1a3a10,#0e2008);color:#80e040;border-top:1px solid #3a6020;}
.snd-horn   {background:linear-gradient(180deg,#3a2000,#201200);color:#ffa030;border-top:1px solid #704010;}
.snd-whistle{background:linear-gradient(180deg,#002a3a,#001520);color:#40c0ff;border-top:1px solid #105070;}
.snd-alarm  {background:linear-gradient(180deg,#3a0010,#200008);color:#ff4060;border-top:1px solid #701030;}
.snd-cheer  {background:linear-gradient(180deg,#2a1a00,#160e00);color:#ffcc30;border-top:1px solid #604020;}
.snd-dunk   {background:linear-gradient(180deg,#1a0a3a,#0e0520);color:#c060ff;border-top:1px solid #502080;}
.snd-airhorn{background:linear-gradient(180deg,#003a2a,#001a14);color:#30ffcc;border-top:1px solid #106050;}
.snd-three  {background:linear-gradient(180deg,#3a2a00,#201800);color:#ffd060;border-top:1px solid #705010;}

.vol-row{
  display:flex;align-items:center;gap:8px;
  margin:6px 0 3px;font-size:11px;letter-spacing:2px;color:#445566;
}
.vol-row input[type=range]{flex:1;accent-color:#00e5cc;cursor:pointer;}

/* ── TOAST ──────────────────────────────────────────── */
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#1a2a1a;border:1px solid #3c3;
  color:#3c3;padding:8px 20px;border-radius:20px;
  font-size:12px;letter-spacing:2px;
  z-index:999;opacity:0;pointer-events:none;
  transition:transform 0.2s,opacity 0.2s;white-space:nowrap;
}
.toast.err{background:#2a1a1a;border-color:#e33;color:#e33;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:380px){
  .score{font-size:40px;}
  .game-time{font-size:26px;}
  button{padding:13px 5px;font-size:11px;}
  .btn-sound{padding:11px 5px;font-size:10px;}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ── HEADER ─────────────────────────────────────── -->
<div class="header">
  <h1>Arena Scoreboard</h1>
  <div class="status-bar">
    <div class="status-dot" id="dot"></div>
    <span id="statusTxt">CONNECTING...</span>
  </div>
</div>

<div class="container">

  <!-- ── SCOREBOARD ──────────────────────────────── -->
  <div class="scoreboard">
    <div class="panel panel-home">
      <div class="panel-label home-label">HOME</div>
      <div class="score" id="home">0</div>
      <div class="foul-row">FOUL<span class="foul-num" id="hf">0</span></div>
    </div>

    <div class="panel panel-time">
      <div class="panel-label time-label">GAME</div>
      <div class="game-time" id="time">12:00</div>
      <span class="running-badge off" id="timerBadge">STOPPED</span>
      <div class="shot-label">SHOT</div>
      <div class="shot-val" id="shot">24</div>
      <span class="running-badge off" id="shotBadge">STOPPED</span>
      <div class="set-time">
        <div class="time-inputs">
          <input type="number" id="min" min="0" max="99" value="12">
          <span>:</span>
          <input type="number" id="sec" min="0" max="59" value="0">
        </div>
        <button class="set-btn" onclick="setTime()">SET TIME</button>
      </div>
    </div>

    <div class="panel panel-guest">
      <div class="panel-label guest-label">GUEST</div>
      <div class="score" id="guest">0</div>
      <div class="foul-row">FOUL<span class="foul-num" id="gf">0</span></div>
    </div>
  </div>

  <!-- ── SCORE ────────────────────────────────────── -->
  <div class="section-label">Score</div>
  <div class="team-row">
    <span class="home-label">HOME</span>
    <span class="guest-label">GUEST</span>
  </div>
  <div class="btn-group">
    <button class="btn-home"  onclick="addScore('home',1)">+1</button>
    <button class="btn-home"  onclick="addScore('home',2)">+2</button>
    <button class="btn-home"  onclick="addScore('home',3)">+3</button>
    <button class="btn-guest" onclick="addScore('guest',1)">+1</button>
    <button class="btn-guest" onclick="addScore('guest',2)">+2</button>
    <button class="btn-guest" onclick="addScore('guest',3)">+3</button>
  </div>
  <div class="btn-group">
    <button class="btn-sub" onclick="addScore('home',-1)">HOME −1</button>
    <button class="btn-sub" onclick="addScore('guest',-1)">GUEST −1</button>
  </div>

  <!-- ── FOULS ────────────────────────────────────── -->
  <div class="section-label">Fouls</div>
  <div class="btn-group">
    <button class="btn-home"  onclick="addFoul('hf')">HOME FOUL</button>
    <button class="btn-guest" onclick="addFoul('gf')">GUEST FOUL</button>
  </div>
  <div class="btn-group">
    <button class="btn-sub" onclick="addFoul('hf',-1)">HOME −1</button>
    <button class="btn-sub" onclick="addFoul('gf',-1)">GUEST −1</button>
  </div>

  <!-- ── GAME TIMER ───────────────────────────────── -->
  <div class="section-label">Game Timer</div>
  <div class="btn-group">
    <button class="btn-start" onclick="setTimerRun(true)">&#9654; START</button>
    <button class="btn-pause" onclick="setTimerRun(false)">&#9646;&#9646; PAUSE</button>
  </div>

  <!-- ── SHOT CLOCK ───────────────────────────────── -->
  <div class="section-label">Shot Clock</div>
  <div class="btn-group">
    <button class="btn-shotst"  onclick="setShotRun(true)">&#9654; START</button>
    <button class="btn-neutral" onclick="setShotRun(false)">&#9646;&#9646; PAUSE</button>
    <button class="btn-neutral" onclick="resetShot(24)">&#8634; RESET</button>
  </div>
  <div class="btn-group">
    <button class="btn-neutral" onclick="resetShot(24)">24s</button>
    <button class="btn-neutral" onclick="resetShot(14)">14s</button>
  </div>

  <!-- ── PERIOD ────────────────────────────────────── -->
  <div class="section-label">Period</div>
  <div class="btn-group" id="periodBtns">
    <button class="btn-period" id="pBtn1" onclick="setPeriod(1)">Q1</button>
    <button class="btn-period" id="pBtn2" onclick="setPeriod(2)">Q2</button>
    <button class="btn-period" id="pBtn3" onclick="setPeriod(3)">Q3</button>
    <button class="btn-period" id="pBtn4" onclick="setPeriod(4)">Q4</button>
  </div>

  <!-- ── SOUNDBOARD ───────────────────────────────── -->
  <div class="section-label">Soundboard</div>
  <div class="vol-row">
    <span>&#128266;</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.7">
    <span>VOL</span>
  </div>
  <div class="soundboard-grid">
    <button class="btn-sound snd-airhorn" onclick="playSound('airhorn',this)">
      <span class="snd-icon">&#128227;</span>AIR HORN
    </button>
    <button class="btn-sound snd-whistle" onclick="playSound('whistle',this)">
      <span class="snd-icon">&#128168;</span>WHISTLE
    </button>
    <button class="btn-sound snd-crowd" onclick="playSound('crowd',this)">
      <span class="snd-icon">&#128483;</span>CROWD CHEER
    </button>
    <button class="btn-sound snd-cheer" onclick="playSound('ooh',this)">
      <span class="snd-icon">&#128562;</span>OOH / GASP
    </button>
    <button class="btn-sound snd-dunk" onclick="playSound('dunk',this)">
      <span class="snd-icon">&#127936;</span>DUNK BOOM
    </button>
    <button class="btn-sound snd-three" onclick="playSound('three',this)">
      <span class="snd-icon">&#127362;</span>3-POINTER
    </button>
    <button class="btn-sound snd-alarm" onclick="playSound('alarm',this)">
      <span class="snd-icon">&#128680;</span>ALARM
    </button>
    <button class="btn-sound snd-horn" onclick="playSound('horn',this)">
      <span class="snd-icon">&#127930;</span>GAME HORN
    </button>
  </div>

  <!-- ── SYSTEM ────────────────────────────────────── -->
  <div class="section-label">System</div>
  <div class="btn-group">
    <button class="btn-buzz"   onclick="doBuzz()">&#128276; BUZZER</button>
    <button class="btn-danger" onclick="doReset()">&#9762; RESET ALL</button>
  </div>

</div><!-- /container -->

<script>
// ── FIREBASE INIT ──────────────────────────────────────
var firebaseConfig = {
  apiKey:      "AIzaSyCBeW3-StyUaqnfMb9SeKQL6oESlxJ_ZFg",
  databaseURL: "https://scoreboard-c0863-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

var scoreRef;
var _db;

window.onload = function() {
  firebase.initializeApp(firebaseConfig);
  _db      = firebase.database();
  scoreRef = _db.ref("scoreboard");
  startListeners();
};

// ── TOAST ──────────────────────────────────────────────
var _tt = null;
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast' + (err ? ' err' : '') + ' show';
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(function(){ t.className = 'toast' + (err ? ' err' : ''); }, 1400);
}

// ── SCORE ──────────────────────────────────────────────
function addScore(field, val) {
  scoreRef.child(field).transaction(function(cur) {
    var n = (cur || 0) + val;
    return n < 0 ? 0 : n;
  });
}

// ── FOULS ──────────────────────────────────────────────
function addFoul(field, val) {
  val = (val === undefined) ? 1 : val;
  scoreRef.child(field).transaction(function(cur) {
    var n = (cur || 0) + val;
    return n < 0 ? 0 : n;
  });
}

// ── TIMER CONTROL ──────────────────────────────────────
function setTimerRun(state) {
  scoreRef.child("timerRun").set(state);
  toast(state ? "TIMER STARTED" : "TIMER PAUSED");
}

// ── SHOT CLOCK ─────────────────────────────────────────
function setShotRun(state) {
  scoreRef.child("shotRun").set(state);
  toast(state ? "SHOT STARTED" : "SHOT PAUSED");
}
function resetShot(val) {
  scoreRef.update({ shot: val, shotRun: true });
  toast("SHOT RESET " + val + "s — RUNNING");
}

// ── PERIOD ─────────────────────────────────────────────
function setPeriod(n) {
  scoreRef.update({
    period: n, timerRun: false, shotRun: false,
    minutes: 12, seconds: 0, shot: 24
  });
  toast("QUARTER " + n);
}

// ── SET TIME ───────────────────────────────────────────
function setTime() {
  var m = parseInt(document.getElementById('min').value, 10);
  var s = parseInt(document.getElementById('sec').value, 10);
  if (isNaN(m) || isNaN(s)) { toast('ENTER TIME', true); return; }
  m = Math.max(0, Math.min(99, m));
  s = Math.max(0, Math.min(59, s));
  scoreRef.update({ minutes: m, seconds: s, timerRun: false });
  toast("TIME SET");
}

// ── BUZZER ─────────────────────────────────────────────
function doBuzz() {
  scoreRef.child("buzz").set(false).then(function() {
    scoreRef.child("buzz").set(true);
  });
  toast("BUZZER!");
}

// ── RESET ALL ──────────────────────────────────────────
function doReset() {
  if (!confirm("Reset entire scoreboard?")) return;
  scoreRef.set({
    home: 0, guest: 0, hf: 0, gf: 0,
    shot: 24, period: 1, minutes: 12, seconds: 0,
    timerRun: false, shotRun: false, buzz: false
  });
  toast("RESET DONE");
}

// ── SOUNDBOARD ─────────────────────────────────────────
// All sounds are synthesized using Web Audio API — no files needed
var audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Resume if suspended (browser autoplay policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function getVol() {
  return parseFloat(document.getElementById('volSlider').value);
}

// Master gain helper
function makeGain(ctx, vol) {
  var g = ctx.createGain();
  g.gain.value = vol;
  g.connect(ctx.destination);
  return g;
}

// Generic oscillator note helper
function playTone(freq, type, start, dur, vol, ctx, out) {
  var osc = ctx.createOscillator();
  var g   = ctx.createGain();
  osc.type      = type;
  osc.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  osc.connect(g);
  g.connect(out);
  osc.start(start);
  osc.stop(start + dur + 0.05);
}

// Noise burst helper (for crowd/impact sounds)
function playNoise(start, dur, vol, ctx, out) {
  var bufSize = ctx.sampleRate * dur;
  var buf     = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  var data    = buf.getChannelData(0);
  for (var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var filter = ctx.createBiquadFilter();
  filter.type            = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value         = 0.5;
  var g = ctx.createGain();
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(out);
  src.start(start);
  src.stop(start + dur + 0.05);
}

var soundFns = {

  // 🔊 Air Horn — long descending blare
  airhorn: function(ctx, out, vol) {
    var t = ctx.currentTime;
    playTone(320, 'sawtooth', t,       1.2, vol * 0.8, ctx, out);
    playTone(160, 'sawtooth', t + 0.1, 1.1, vol * 0.5, ctx, out);
    playTone(640, 'sawtooth', t,       0.3, vol * 0.3, ctx, out);
  },

  // 🌬 Whistle — sharp high frequency with vibrato
  whistle: function(ctx, out, vol) {
    var t   = ctx.currentTime;
    var osc = ctx.createOscillator();
    var lfo = ctx.createOscillator();
    var lfoG = ctx.createGain();
    var g   = ctx.createGain();
    osc.type      = 'sine';
    osc.frequency.setValueAtTime(2800, t);
    osc.frequency.linearRampToValueAtTime(3200, t + 0.1);
    osc.frequency.linearRampToValueAtTime(2900, t + 0.6);
    lfo.type = 'sine';
    lfo.frequency.value = 8;
    lfoG.gain.value = 60;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    lfo.connect(lfoG);
    lfoG.connect(osc.frequency);
    osc.connect(g);
    g.connect(out);
    osc.start(t); osc.stop(t + 0.75);
    lfo.start(t); lfo.stop(t + 0.75);
  },

  // 👥 Crowd Cheer — layered noise burst
  crowd: function(ctx, out, vol) {
    var t = ctx.currentTime;
    for (var i = 0; i < 3; i++) {
      playNoise(t + i * 0.05, 1.5 - i * 0.1, vol * (0.6 - i * 0.1), ctx, out);
    }
    // Rising excitement tones
    [300, 450, 600, 800].forEach(function(f, idx) {
      playTone(f, 'sine', t + idx * 0.08, 0.8, vol * 0.08, ctx, out);
    });
  },

  // 😲 Ooh / Gasp — descending "ohhh" crowd
  ooh: function(ctx, out, vol) {
    var t   = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, t);
    osc.frequency.linearRampToValueAtTime(250, t + 0.8);
    g.gain.setValueAtTime(vol * 0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 1.0);
    playNoise(t, 0.8, vol * 0.3, ctx, out);
  },

  // 🏀 Dunk Boom — low impact thud
  dunk: function(ctx, out, vol) {
    var t   = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.45);
    playNoise(t, 0.15, vol * 0.8, ctx, out);
    // Follow-up crowd
    playNoise(t + 0.15, 1.0, vol * 0.3, ctx, out);
  },

  // 3️⃣ 3-Pointer — ascending victory arpeggio
  three: function(ctx, out, vol) {
    var t = ctx.currentTime;
    [523, 659, 784, 1047].forEach(function(f, i) {
      playTone(f, 'triangle', t + i * 0.12, 0.4, vol * 0.6, ctx, out);
    });
    playNoise(t + 0.4, 0.8, vol * 0.25, ctx, out);
  },

  // 🚨 Alarm — urgent repeating beeps
  alarm: function(ctx, out, vol) {
    var t = ctx.currentTime;
    for (var i = 0; i < 6; i++) {
      playTone(1200, 'square', t + i * 0.18, 0.12, vol * 0.5, ctx, out);
      playTone(900,  'square', t + i * 0.18 + 0.09, 0.08, vol * 0.4, ctx, out);
    }
  },

  // 🎺 Game Horn — classic end-of-period horn
  horn: function(ctx, out, vol) {
    var t = ctx.currentTime;
    playTone(220, 'sawtooth', t,        0.15, vol * 0.7, ctx, out);
    playTone(220, 'sawtooth', t + 0.18, 0.15, vol * 0.7, ctx, out);
    playTone(220, 'sawtooth', t + 0.36, 0.8,  vol * 0.8, ctx, out);
    playTone(110, 'sawtooth', t + 0.36, 0.8,  vol * 0.4, ctx, out);
  }
};

function playSound(name, btn) {
  var ctx = getAudioCtx();
  var out = makeGain(ctx, getVol());
  var fn  = soundFns[name];
  if (!fn) return;
  fn(ctx, out, 1.0);
  // Visual pulse
  btn.classList.add('playing');
  setTimeout(function(){ btn.classList.remove('playing'); }, 250);
}

// ── LISTENERS ──────────────────────────────────────────
function startListeners() {

  scoreRef.on("value", function(snap) {
    var d = snap.val() || {};

    document.getElementById('home') .textContent = d.home  || 0;
    document.getElementById('guest').textContent = d.guest || 0;
    document.getElementById('hf')   .textContent = d.hf    || 0;
    document.getElementById('gf')   .textContent = d.gf    || 0;
    document.getElementById('shot') .textContent = (d.shot !== undefined) ? d.shot : 24;

    var m = (d.minutes !== undefined) ? d.minutes : 12;
    var s = (d.seconds !== undefined) ? d.seconds : 0;
    document.getElementById('time').textContent = pad(m) + ":" + pad(s);

    var tb  = document.getElementById('timerBadge');
    var shb = document.getElementById('shotBadge');
    if (d.timerRun) { tb.textContent  = 'RUNNING'; tb.className  = 'running-badge on'; }
    else            { tb.textContent  = 'STOPPED'; tb.className  = 'running-badge off'; }
    if (d.shotRun)  { shb.textContent = 'RUNNING'; shb.className = 'running-badge on'; }
    else            { shb.textContent = 'STOPPED'; shb.className = 'running-badge off'; }

    var p = d.period || 1;
    for (var i = 1; i <= 4; i++) {
      var btn = document.getElementById('pBtn' + i);
      if (btn) btn.className = 'btn-period' + (i === p ? ' active' : '');
    }

  }, function() {
    document.getElementById('dot')      .className  = 'status-dot off';
    document.getElementById('statusTxt').textContent = 'DISCONNECTED';
  });

  _db.ref(".info/connected").on("value", function(snap) {
    if (snap.val() === true) {
      document.getElementById('dot')      .className  = 'status-dot on';
      document.getElementById('statusTxt').textContent = 'CONNECTED';
    } else {
      document.getElementById('dot')      .className  = 'status-dot off';
      document.getElementById('statusTxt').textContent = 'DISCONNECTED';
    }
  });
}

function pad(n) { return String(n).padStart(2, '0'); }
